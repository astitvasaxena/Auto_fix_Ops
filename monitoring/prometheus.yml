# Prometheus configuration for AutoFixOps
# Scrapes the local AutoFixOps target app's /metrics endpoint.

global:
  scrape_interval: 15s        # How often to scrape targets
  evaluation_interval: 15s    # How often to evaluate rules
  scrape_timeout: 10s         # Per-scrape timeout

# Alertmanager configuration — routes fired alerts to Alertmanager container
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Alert rule files
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # ─── Prometheus self-monitoring ─────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── AutoFixOps target app ───────────────────────────────────
  # Prometheus runs in Docker, so Docker Desktop's host gateway reaches the
  # target on the Windows host. The target address lives in
  # targets/target_app.json so the same job (and the same alert rules) can
  # watch either the local process (host.docker.internal:8001, default) or the
  # Kubernetes demo pod via its NodePort (host.docker.internal:30081).
  # Switch with: python scripts/k8s_demo.py target local|k8s
  - job_name: 'autofixops-target'
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
        refresh_interval: 15s
