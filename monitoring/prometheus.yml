# Prometheus configuration for AutoFixOps
# Scrapes the local AutoFixOps target app's /metrics endpoint.

global:
  scrape_interval: 15s        # How often to scrape targets
  evaluation_interval: 15s    # How often to evaluate rules
  scrape_timeout: 10s         # Per-scrape timeout

# Alertmanager configuration — routes fired alerts to Alertmanager container
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Alert rule files
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # ─── Prometheus self-monitoring ─────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── Local AutoFixOps target app ─────────────────────────────
  # Prometheus runs in Docker, so Docker Desktop's host gateway reaches
  # the target process exposed on the Windows host.
  - job_name: 'autofixops-target'
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          environment: 'local'
          app: 'target-app'
          service: 'target-app'
