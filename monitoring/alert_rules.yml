# AutoFixOps Alert Rules
# These fire webhooks to the AutoFixOps API via Alertmanager
# when the local target app (kubernetes_integration/target_app, port 8001)
# shows anomalies. Metrics are the standard process_* series it exports.

groups:
  - name: autofixops_target_app
    rules:

      # ── Memory Leak Detection ────────────────────────────────
      # Fires when the app's RSS memory increases by >50MB
      # within a 2-minute window (indicates active leak).
      - alert: TargetAppMemoryLeak
        expr: >
          (process_resident_memory_bytes{job="autofixops-target"}
           - process_resident_memory_bytes{job="autofixops-target"} offset 2m)
          > 50000000
        for: 15s
        labels:
          severity: critical
          namespace: autofixops
          pod: autofixops-target-app
          container: target-app
        annotations:
          summary: "Memory leak detected on autofixops-target-app"
          description: >
            Container target-app in pod autofixops-target-app (namespace autofixops)
            increased its memory by more than 50MB in the last 2 minutes.
            This indicates a potential memory leak and OOMKilled risk.

      # ── High Memory (relative to the limit in force) ─────────
      # Fires when RSS exceeds 85% of the container memory limit, which the
      # target exports as target_app_memory_limit_bytes (read from its cgroup),
      # so the rule follows the limit after a remediation raises it. Without a
      # limit metric (the local Windows process) it falls back to 85% of the
      # manifest's 100Mi (0.85 * 104857600). The Stage 2 proposer only proposes
      # an increase at >= 80% utilisation.
      # Annotations carry no numbers: the LLMs may only cite measured facts.
      - alert: HighMemoryUsage
        expr: >
          (process_resident_memory_bytes{job="autofixops-target"}
             / on(instance) target_app_memory_limit_bytes{job="autofixops-target"} > 0.85)
          or
          (process_resident_memory_bytes{job="autofixops-target"} > 89128960
             unless on(instance) target_app_memory_limit_bytes{job="autofixops-target"})
        for: 15s
        labels:
          severity: warning
          namespace: autofixops
          pod: autofixops-target-app
          container: target-app
        annotations:
          summary: "High memory usage on autofixops-target-app"
          description: >
            Container target-app in pod autofixops-target-app is using most
            of its memory limit (OOMKilled risk).

      # ── High CPU (relative to the CPU limit in force) ──────────
      # Fires when the process uses more than 90% of the container CPU limit
      # (exported by the target as target_app_cpu_limit_cores from its cgroup)
      # for a minute: it is pinned at its limit and throttled. Without a CPU
      # limit metric (the local Windows process) it does not fire.
      - alert: HighCPUUsage
        expr: >
          rate(process_cpu_seconds_total{job="autofixops-target"}[1m])
            / on(instance) target_app_cpu_limit_cores{job="autofixops-target"} > 0.9
        for: 1m
        labels:
          severity: warning
          namespace: autofixops
          pod: autofixops-target-app
          container: target-app
        annotations:
          summary: "High CPU usage on autofixops-target-app"
          description: >
            Container target-app in pod autofixops-target-app is using nearly
            all of its CPU limit and is being throttled.

      # ── CrashLoop Detection (via process restart) ────────────
      # Detects repeated restarts: the process start time changed more than
      # once in the last 5 minutes. One restart (e.g. the rollout of an
      # approved remediation, or a single OOMKill) is not a crash loop.
      # Fast restarts are too quick for the `up==0` approach to catch.
      - alert: TargetAppCrashLoop
        expr: changes(process_start_time_seconds{job="autofixops-target"}[5m]) > 1
        for: 0s
        labels:
          severity: critical
          namespace: autofixops
          pod: autofixops-target-app
          container: target-app
        annotations:
          summary: "Target app is crash-looping (process restarted)"
          description: >
            The target-app process has restarted repeatedly.
            This indicates a crash loop or forced restarts.

      # ── Target Completely Down ───────────────────────────────
      # Fires if the scrape target is totally unreachable for 30s.
      - alert: TargetAppDown
        expr: up{job="autofixops-target"} == 0
        for: 30s
        labels:
          severity: critical
          namespace: autofixops
          pod: autofixops-target-app
          container: target-app
        annotations:
          summary: "Target app is completely unreachable"
          description: >
            The target-app scrape target is unreachable: Prometheus scrape
            failures indicate the application is down or not ready (for example
            a container that keeps crashing).
