# AutoFixOps CI: offline Python tests, config validation, dashboard build.
#
# Safety:
# - No secrets are used; the job token is read-only (contents: read).
# - Code under test never connects to Postgres, Redis, Prometheus, Ollama,
#   OpenAI or GitHub: endpoints point at closed local port 9 and tests that
#   need a live API or real Postgres are not selected.
# - The toolchain itself downloads from PyPI, download.pytorch.org,
#   huggingface.co (only on an embedding-model cache miss), Docker Hub and npm.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (superseded PR runs are cancelled); every push to main and
  # every manual run gets its own group, so none of them is cancelled.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash   # bash -eo pipefail

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # Safe test configuration. CI has no .env; these values replace it.
  POSTGRES_URL: "sqlite://"            # lazy engine; tests use in-memory SQLite
  MONGO_URL: ""                        # in-memory context store
  QDRANT_URL: ""                       # in-memory Qdrant (seed test uses a temp dir)
  QDRANT_PATH: ""
  REDIS_URL: "redis://127.0.0.1:9/0"
  PROMETHEUS_URL: "http://127.0.0.1:9"
  DEBUG_PROMPTS: "false"               # read by debug tracing once that code is committed
  AI_INCIDENT_ANALYSIS: "true"
  LLM_PROVIDER: "ollama"               # tests inject stub LLMs; no model is called
  OLLAMA_BASE_URL: "http://127.0.0.1:9"
  OPENAI_API_KEY: ""                   # never a real key; also keeps the harness offline
  GITHUB_TOKEN: ""                     # remediation code must never see a token here
  GITHUB_REPO: ""
  HF_HUB_OFFLINE: "1"                  # only the model-download step overrides this
  TRANSFORMERS_OFFLINE: "1"
  # Test selection (single source of truth for every step below).
  MAIN_TEST_FILES: >-
    tests/ai/test_incident_analysis.py
    tests/ai/test_llm_provider.py
    tests/ai/test_patch_proposals.py
    tests/ai/test_patch_routing.py
    tests/ai/test_telemetry.py
    tests/test_pre_diagnosis_context_flow.py
    tests/rag/test_runbooks.py
    tests/safety_drills/test_bad_diagnosis.py
    tests/safety_drills/test_bad_patch.py
    tests/safety_drills/test_failure_and_timeline.py
    tests/safety_drills/test_false_recovery.py
    tests/evaluator/test_rollback.py
  KNOWN_FAILURES: >-
    tests/safety_drills/test_bad_patch.py::test_patch_does_not_mutate_original
    tests/safety_drills/test_bad_patch.py::test_restart_annotation_format
  SLOW_TESTS: >-
    tests/rag/test_runbooks.py::test_seed_script_replaces_legacy_and_is_idempotent

jobs:
  tests:
    name: Python tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch, then project requirements
        id: deps
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Pin the installed CPU build so resolving requirements.txt cannot swap in CUDA torch.
          echo "torch==$(python -c 'import torch; print(torch.__version__)')" > "$RUNNER_TEMP/constraints.txt"
          python -m pip install -r requirements.txt "pytest>=9,<10" -c "$RUNNER_TEMP/constraints.txt"
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None, 'CUDA build installed'; print('torch', torch.__version__, '(CPU)')"
          python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"

      - name: Compute embedding-model cache key
        id: hf-key
        run: |
          echo "HF_HOME=$HOME/.cache/huggingface" >> "$GITHUB_ENV"
          echo "key=hf-all-MiniLM-L6-v2-$(python -c "import importlib.metadata as m; print('-'.join(m.version(p) for p in ('sentence-transformers', 'transformers', 'huggingface-hub')))")" >> "$GITHUB_OUTPUT"

      - name: Restore embedding-model cache
        id: hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-key.outputs.key }}
          restore-keys: hf-all-MiniLM-L6-v2-

      - name: Download embedding model (no exact cache hit)
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Save embedding-model cache
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-key.outputs.key }}

      - name: Verify embedding model loads offline
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')" \
            || { echo "::error::Embedding model is not loadable offline; the cache is stale or incomplete."; exit 1; }

      - name: Run offline test suite
        id: main-tests
        run: |
          deselect=()
          for t in $KNOWN_FAILURES $SLOW_TESTS; do deselect+=(--deselect "$t"); done
          python -m pytest -p no:cacheprovider -ra --durations=15 \
            --junitxml="$RUNNER_TEMP/junit-main.xml" \
            $MAIN_TEST_FILES "${deselect[@]}"

      - name: Check known pre-existing failures (test_bad_patch.py)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          files=$(for t in $KNOWN_FAILURES; do echo "${t%%::*}"; done | sort -u)
          set +e
          python -m pytest -p no:cacheprovider -rA $files --junitxml="$RUNNER_TEMP/junit-known-failures.xml"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::pytest exited with $rc (collection or internal error) while checking known failures"
            exit 1
          fi
          python - "$RUNNER_TEMP/junit-known-failures.xml" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          # Pre-existing failures recorded in the Stage 0 report. They are deselected
          # from the main suite and checked here so they stay visible.
          EXPECTED = set(os.environ["KNOWN_FAILURES"].split())
          cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          node = lambda tc: tc.get("classname", "").replace(".", "/") + ".py::" + tc.get("name", "")
          ran = {node(tc) for tc in cases}
          failed = {node(tc) for tc in cases if tc.find("failure") is not None or tc.find("error") is not None}
          status = lambda t: "not run" if t not in ran else ("fail" if t in failed else "pass")
          lines = ["### Known pre-existing failures (tracked, not hidden)", "",
                   "| Test | Expected | Actual |", "|---|---|---|"]
          for t in sorted(EXPECTED | failed):
              lines.append(f"| `{t}` | {'fail' if t in EXPECTED else 'pass'} | {status(t)} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          for t in sorted(EXPECTED & failed):
              print(f"::warning title=Known failing test::{t} still fails (pre-existing)")
          errors = []
          if EXPECTED - ran:
              errors.append(f"Known-failure tests were not collected: {sorted(EXPECTED - ran)}")
          if failed - EXPECTED:
              errors.append(f"Unexpected failures: {sorted(failed - EXPECTED)}")
          if (EXPECTED & ran) - failed:
              errors.append(f"Known failures now pass; remove them from KNOWN_FAILURES: {sorted((EXPECTED & ran) - failed)}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

      - name: Report tests not selected by CI
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set +e
          python -m pytest -p no:cacheprovider --collect-only -q tests > "$RUNNER_TEMP/collected.txt" 2>&1
          rc=$?
          set -e
          python - "$RUNNER_TEMP/collected.txt" "$rc" <<'PY'
          import os, sys
          collected = {l.strip() for l in open(sys.argv[1], encoding="utf-8") if "::" in l and not l.startswith(("ERROR", "FAILED"))}
          files = set(os.environ["MAIN_TEST_FILES"].split())
          covered = {n for n in collected if n.split("::")[0] in files} | set(os.environ["SLOW_TESTS"].split())
          unselected = sorted(collected - covered)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### Test selection\n\n{len(collected)} collected, {len(collected) - len(unselected)} selected by CI, {len(unselected)} not selected.\n")
              fh.writelines(f"- not selected: `{n}`\n" for n in unselected)
          for n in unselected:
              print(f"::warning title=Test not selected by CI::{n}")
          if sys.argv[2] not in ("0", "5"):
              print(f"::warning::pytest --collect-only exited with {sys.argv[2]}; see the collected.txt artifact")
          PY

      - name: Diagnosis accuracy harness (informational; fails only if it crashes)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          PYTHONPATH=. python tests/evaluator/harness.py | tee "$RUNNER_TEMP/harness.txt"
          { echo "### Diagnosis harness (informational)"; echo '```'; tail -n 4 "$RUNNER_TEMP/harness.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-test-reports
          path: |
            ${{ runner.temp }}/junit-*.xml
            ${{ runner.temp }}/pip-freeze.txt
            ${{ runner.temp }}/collected.txt
            ${{ runner.temp }}/harness.txt
          if-no-files-found: warn
          retention-days: 14

  rag-seed:
    name: RAG seed script (slow; temporary store only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU-only PyTorch, then project requirements
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          echo "torch==$(python -c 'import torch; print(torch.__version__)')" > "$RUNNER_TEMP/constraints.txt"
          python -m pip install -r requirements.txt "pytest>=9,<10" -c "$RUNNER_TEMP/constraints.txt"
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None, 'CUDA build installed'"

      - name: Compute embedding-model cache key
        id: hf-key
        run: |
          echo "HF_HOME=$HOME/.cache/huggingface" >> "$GITHUB_ENV"
          echo "key=hf-all-MiniLM-L6-v2-$(python -c "import importlib.metadata as m; print('-'.join(m.version(p) for p in ('sentence-transformers', 'transformers', 'huggingface-hub')))")" >> "$GITHUB_OUTPUT"

      - name: Restore embedding-model cache
        id: hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-key.outputs.key }}
          restore-keys: hf-all-MiniLM-L6-v2-

      - name: Download embedding model (no exact cache hit)
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Save embedding-model cache
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-key.outputs.key }}

      - name: Run seed-script test (temporary on-disk Qdrant only)
        run: |
          python -m pytest -p no:cacheprovider -ra --durations=5 \
            --junitxml="$RUNNER_TEMP/junit-rag-seed.xml" $SLOW_TESTS

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rag-seed-report
          path: ${{ runner.temp }}/junit-rag-seed.xml
          if-no-files-found: warn
          retention-days: 14

  config:
    name: Config validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Parse all tracked YAML files
        run: |
          python -m pip install "PyYAML>=6.0.1,<7"
          git ls-files '*.yml' '*.yaml' > "$RUNNER_TEMP/yaml-files.txt"
          python - "$RUNNER_TEMP/yaml-files.txt" <<'PY'
          import sys, yaml
          files = [line.strip() for line in open(sys.argv[1]) if line.strip()]
          errors = 0
          for path in files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      docs = list(yaml.safe_load_all(fh))
                  print(f"OK  {path} ({len(docs)} document(s))")
              except yaml.YAMLError as exc:
                  errors += 1
                  print(f"::error file={path}::YAML parse error: {exc}")
          sys.exit(1 if errors else 0)
          PY

      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yml config -q

      - name: Validate Prometheus config and rules (promtool)
        run: |
          docker run --rm --network none --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
          docker run --rm --network none --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" \
            "$PROMETHEUS_IMAGE" check rules /etc/prometheus/alert_rules.yml

      - name: Validate Kubernetes PrometheusRule groups (promtool)
        run: |
          mkdir -p "$RUNNER_TEMP/k8s-rules"
          python - kubernetes_integration/monitoring/alerts.yaml "$RUNNER_TEMP/k8s-rules/alerts.rules.yml" <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          assert doc.get("kind") == "PrometheusRule", "expected a PrometheusRule"
          with open(sys.argv[2], "w", encoding="utf-8") as fh:
              yaml.safe_dump({"groups": doc["spec"]["groups"]}, fh, sort_keys=False)
          PY
          docker run --rm --network none --entrypoint promtool -v "$RUNNER_TEMP/k8s-rules:/rules:ro" \
            "$PROMETHEUS_IMAGE" check rules /rules/alerts.rules.yml

      - name: Validate Alertmanager config (amtool)
        run: |
          docker run --rm --network none --entrypoint amtool -v "$PWD/monitoring:/etc/alertmanager:ro" \
            "$ALERTMANAGER_IMAGE" check-config /etc/alertmanager/alertmanager.yml

  dashboard:
    name: Dashboard production build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Unit tests (node:test, no network)
        run: npm test

      - name: Production build
        run: npm run build
