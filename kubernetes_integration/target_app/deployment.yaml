apiVersion: apps/v1
kind: Deployment
metadata:
  name: autofixops-target-app
  namespace: autofixops
  labels:
    app: target-app
    system: autofixops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-app
      system: autofixops
  template:
    metadata:
      labels:
        app: target-app
        system: autofixops
        # Required to tell Prometheus to scrape this pod if using ServiceMonitors or standard pod annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: target-app
        image: autofixops/target-app:latest
        imagePullPolicy: Never # Good for local minikube building
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: target-app-chaos   # chaos faults (engine/k8s_chaos.py); optional
            optional: true
        env:
        # Feature flag for the response cache. The Memory Leak chaos fault leaks in this cache;
        # AutoFixOps may propose "false" (DISABLE_FEATURE_FLAG) through a reviewed pull request.
        - name: RESPONSE_CACHE_ENABLED
          value: "true"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "200Mi" # Very tight memory limit to ensure /leak triggers OOMKilled fast
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready   # fails while background work is too far behind (CPU starvation)
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
