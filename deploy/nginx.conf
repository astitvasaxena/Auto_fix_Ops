# Single public entry point (port 80). Everything except /healthz needs HTTP basic auth,
# because the API has no login of its own and exposes chaos/approve endpoints.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  client_max_body_size 2m;

  auth_basic "AutoFixOps";
  auth_basic_user_file /etc/nginx/htpasswd;

  location = /healthz { auth_basic off; access_log off; default_type text/plain; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Basic auth above is the login. The API's approval check wants a bearer token (it only trusts
    # loopback otherwise), so an authenticated user is mapped to the "dashboard" approver identity.
    proxy_set_header Authorization "Bearer ${APPROVER_TOKEN}";
    proxy_read_timeout 3600s;   # long-lived /events/ws
  }

  location / {
    proxy_pass http://dashboard:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
