# AutoFixOps production stack (single host). Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Only nginx publishes a port. Everything else lives on the private compose network.
name: autofixops

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.api
  env_file: .env.prod
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]   # reach the host's k3s API (6443)
  volumes:
    - /opt/autofixops/kube/config:/etc/autofixops/kubeconfig:ro
    # The image excludes .git; the patch proposer reads 'origin' from this one file (REPO_MISMATCH without it).
    - ../.git/config:/app/.git/config:ro
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      APPROVER_TOKEN: ${APPROVER_TOKEN}
      NGINX_ENVSUBST_FILTER: "^APPROVER_TOKEN$$"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./secrets/htpasswd:/etc/nginx/htpasswd:ro
    depends_on: [api, dashboard]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"], interval: 30s, timeout: 5s, retries: 3 }

  api:
    <<: *app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
        NEXT_PUBLIC_TARGET_APP_URL: ${PUBLIC_BASE_URL}/target
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: autofixops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: autofixops
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U autofixops"], interval: 10s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 10 }

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]   # scrape the target pod's NodePort on the host
    depends_on: [alertmanager]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  prometheus_data:
  alertmanager_data:
