global:
  resolve_timeout: 1m
route:
  receiver: autofixops-webhook
  group_by: ['alertname', 'namespace', 'pod']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 10m
receivers:
  - name: autofixops-webhook
    webhook_configs:
      - url: 'http://api:8000/api/v1/alerts'
        send_resolved: true
        max_alerts: 10
